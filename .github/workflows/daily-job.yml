# Runs the daily job (reminders, session reminders, project of the month, news) for a site
# without Vercel Cron, e.g. Render alone (docs/RENDER.md). While Vercel production runs,
# vercel.json already does this: leave APP_URL unset so the job doesn't run twice.
# Needs the repository variable APP_URL and the secret CRON_SECRET (the same value as the site's).
name: Daily job

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/daily
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping (see docs/RENDER.md)."
            exit 0
          fi
          # Retries cover a free Render service waking up.
          curl --fail-with-body -sS -m 120 --retry 3 --retry-delay 30 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/daily"
