# Creates the FIRST Admin in an environment that has none (normally once, at go-live).
# The script refuses if an active Admin already exists. Runs only when started by hand;
# the `production` environment additionally requires a reviewer's approval.
#
# The temporary password is printed in this run's log, which repo collaborators can read:
# the new Admin must change it on the Account page right after signing in.
name: Create first Admin

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment"
        type: choice
        options: [staging, production]
      name:
        description: "Admin's full name"
        required: true
      email:
        description: "Admin's email"
        required: true

permissions:
  contents: read

jobs:
  create-admin:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create Admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          ADMIN_NAME: ${{ inputs.name }}
          ADMIN_EMAIL: ${{ inputs.email }}
        run: npm run admin:create
