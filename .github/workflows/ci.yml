name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names below are the required status checks for branch protection.
jobs:
  quality:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only. The build never connects to a database,
      # and no real secret is used in CI.
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agod_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database. Never a Neon branch with real data.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agod_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: Check migration history consistency
        run: npm run db:check
      - name: Apply all migrations to an empty database
        run: npm run db:migrate
      - name: Fail if the schema has changes without a migration
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::Schema changed without a committed migration. Run 'npm run db:generate -- --name <description>'."
            git status --porcelain db/migrations
            exit 1
          fi
      - name: Integration tests (permissions and row-level security)
        run: npm run test:integration
